name: CI Pipeline

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - run: uv sync --extra dev
      - name: Ruff check
        run: uv run ruff check src/rlmstudio/ tests/
      - name: Ruff format check
        run: uv run ruff format --check src/rlmstudio/ tests/

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - run: uv sync --extra dev
      - name: Mypy
        run: uv run mypy src/rlmstudio/ --ignore-missing-imports

  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - run: uv sync --extra dev --extra studio
      - name: Run tests with coverage (non-UI runtime; ui/* excluded — see pyproject.toml)
        # --runslow includes spawn-heavy tests like TestTopLevelScriptEntrypoint
        # which are gated by default for local dev speed but MUST run in CI.
        # -n auto from pyproject.toml [tool.pytest.ini_options] addopts parallelizes.
        run: uv run pytest tests/ --runslow --cov=rlmstudio --cov-report=term-missing --cov-report=xml --cov-fail-under=80 -q
      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  test-frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci --prefix frontend
      - name: TypeScript check
        run: cd frontend && npx tsc --noEmit
      - name: Lint
        run: npm run lint --prefix frontend
      - name: Test
        run: npm run test --prefix frontend
      - name: Build
        run: npm run build --prefix frontend

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      # Audit the full user-facing surface (`all` = studio + eval + interop)
      # plus the dev toolchain.
      - run: uv sync --extra dev --extra all
      - name: Bandit security scan
        run: uv run bandit -r src/rlmstudio/server/ src/rlmstudio/application/ src/rlmstudio/domain/ src/rlmstudio/infrastructure/ -c pyproject.toml
      - name: pip-audit vulnerability scan
        run: uv run pip-audit --skip-editable

  docker-sandbox:
    name: Docker Sandbox
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build sandbox image
        run: docker build -t rlmkit-sandbox -f docker/Dockerfile.sandbox docker/
      - name: Smoke test sandbox image
        run: docker run --rm --network=none rlmkit-sandbox python3 -c "print('sandbox OK')"

  build:
    name: Build Check
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test-backend, test-frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - run: uv sync --extra studio
      - name: Verify package imports
        run: uv run python -c "from rlmstudio.server.app import app; print('Server OK')"
