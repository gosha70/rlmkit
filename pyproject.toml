[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rlmkit"
version = "1.0.0"
description = "Recursive Language Model (RLM) toolkit for managing large context through code generation"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "RLMKit Contributors"}
]
keywords = ["llm", "rlm", "recursive", "context", "large-context", "code-generation"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "httpx>=0.25.0",
    "pyyaml>=6.0",
    "psutil>=5.9.0",
    "cryptography>=46.0.7",  # CVE-2026-34073, CVE-2026-39892 fixes
    "litellm>=1.83.7",  # CVE-2026-35029, CVE-2026-35030 fixed in 1.83.0
    "RestrictedPython>=7.0",
    "tenacity>=9.1.2",
    "pygments>=2.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",  # CVE-2025-71176 fix
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.24.0",
    # pytest-xdist parallelizes the sandbox suite across CPU cores.
    # The subprocess sandbox uses spawn (see subprocess_sandbox.py for why),
    # and spawn cold-start is I/O-heavy, so the suite parallelizes well:
    # ~118s serial → ~25-30s with -n auto on an 8-core machine.
    "pytest-xdist>=3.5.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "bandit>=1.7.0",
    "pre-commit>=3.7.0",
    "types-pyyaml>=6.0.12.20250915",
    "nest-asyncio>=1.6.0",
    "pip-audit>=2.7.0",
    "requests>=2.33.0",  # CVE-2026-25645 fix; transitive via pip-audit/tiktoken
]

server = [
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "python-multipart>=0.0.26",  # CVE-2026-40347 fix
    "pypdf>=6.10.2",  # PDF text extraction in /api/files/upload
    "python-docx>=1.1.0",  # DOCX text extraction in /api/files/upload
    "lxml>=6.1.0",  # CVE-2026-41066 fix (transitive via python-docx)
]

ui = [
    "streamlit>=1.55.0",  # CVE-2026-SSRF fix (NTLM credential exposure on Windows)
    "plotly>=5.18.0",
    # External LLM providers
    "openai>=1.0.0",
    "anthropic>=0.7.0",
    "ollama>=0.1.0",
    "requests>=2.31.0",  # For HTTP-based providers (LM Studio)
]

eval = [
    "openai>=1.0.0",  # For embeddings + generation
]

all = [
    "rlmkit[dev,server,ui,eval]",
]

[project.urls]
Homepage = "https://github.com/your-org/rlmkit"
Repository = "https://github.com/your-org/rlmkit"
Documentation = "https://github.com/your-org/rlmkit/blob/main/README.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rlmkit = ["rlmkit_config.default.yaml"]
"rlmkit.prompts" = ["*.yaml", "*.yml", "*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--verbose",
    "--strict-markers",
    # Parallelize across all available CPU cores.  The subprocess sandbox
    # uses spawn (see subprocess_sandbox.py), and spawn cold-start is
    # I/O-heavy, so the sandbox suite parallelizes well: ~156 s serial →
    # ~16 s with -n auto.  The full backend suite drops from ~206 s to
    # ~45 s on a 14-core machine.  Override with ``-n 0`` for serial
    # debug runs or ``-n 4`` for a specific worker count.
    "-n=auto",
]
filterwarnings = [
    # aiohttp: fixed in Python 3.13.2 but aiohttp hasn't caught up yet
    "ignore::DeprecationWarning:aiohttp",
    # litellm: accesses Pydantic model fields on instances (their internal issue)
    "ignore::pydantic.warnings.PydanticDeprecatedSince211:litellm",
    # RestrictedPython: warns about 'printed' variable in sandbox test code
    "ignore::SyntaxWarning:RestrictedPython",
]
markers = [
    "integration: Integration tests requiring multi-component setup",
    "e2e: End-to-end tests requiring full stack",
    "live: Tests requiring real API keys (external services)",
    "slow: Tests taking more than 5 seconds",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "PT"]
ignore = ["E501"]  # Line length (formatter handles)

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["N802", "N803", "N806", "PT011"]  # Tests: allow naming conventions, broad pytest.raises
"src/rlmkit/server/routes/*" = ["B008", "PT028"]  # Depends() in FastAPI route defaults; PT028: route functions named test_* are not pytest tests

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
# Force CWD as the package-resolution base so that tests/test_api.py resolves
# to "tests.test_api" (not "dev.repo.rlmkit.tests.test_api") even when a
# parent directory happens to contain an __init__.py.
explicit_package_bases = true

[[tool.mypy.overrides]]
# Tests are not checked by CI mypy (which runs only on src/rlmkit/).
# Relax annotations requirement to match that scope.
module = "tests.*"
disallow_untyped_defs = false

[tool.coverage.run]
omit = [
    # These files call Streamlit APIs (st.*, switch_page, session_state) and
    # require a live Streamlit runtime to import. The `ui` extra is not
    # installed in the dev+server test environment, so they cannot be measured
    # here. To cover them: uv sync --extra ui && pytest --cov ...
    #
    # Pure-Python modules under ui/ (data/, services/, utils/, file_processor)
    # are NOT omitted — they are imported by the server layer and are measured.
    "src/rlmkit/ui/app.py",
    "src/rlmkit/ui/charts.py",
    "src/rlmkit/ui/session.py",
    "src/rlmkit/ui/pages/*",
    "src/rlmkit/ui/components/*",
]

[tool.bandit]
exclude_dirs = ["tests", "poc", "notebooks"]
skips = ["B101", "B102", "B112"]  # B101: assert, B102: exec (sandbox by design), B112: try-except-continue (LiteLLM pricing fallback)
