# RLM Studio — single-node self-hosted compose stack.
#
# One-command startup:
#
#   cp .env.example .env   # fill in at least one provider key (OPENAI_API_KEY
#                          # or ANTHROPIC_API_KEY), then:
#   docker compose up --build
#
# Backend:  http://localhost:8000  (health at /health)
# Frontend: http://localhost:3000
#
# State persists to the `rlm-studio-data` named volume, mounted at
# /home/rlmstudio/.rlm-studio inside the backend container (the non-root
# runtime user's state directory). Back it up with:
#
#   docker run --rm -v rlm-studio-data:/data -v "$PWD:/backup" alpine \
#     tar -czf /backup/rlm-studio-backup-$(date +%F).tar.gz -C /data .
#
# Upgrading from the pre-rename stack (RLMKit): state lived in the
# `rlmkit-data` volume. Copy it once before the first `up`:
#
#   docker volume create rlm-studio-data
#   docker run --rm -v rlmkit-data:/from -v rlm-studio-data:/to alpine \
#     sh -c "cp -a /from/. /to/"
#
# For scope and support boundary, see docs/OPERATIONS.md. v1.1 is
# single-node; this compose stack is intentionally not a multi-tenant
# deployment template.

name: rlm-studio

services:

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    image: rlm-studio-api:local
    container_name: rlm-studio-backend
    restart: unless-stopped
    environment:
      # Provider keys. Read from the compose .env file. Anything not set
      # here can also be configured via the Studio Settings page at
      # runtime; the SecretStore (chmod 600 JSON in the volume) will
      # persist them.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}

      # Optional: point at a local Ollama / vLLM instance reachable from
      # this container. If you enable the bundled Ollama service below,
      # set OLLAMA_BASE_URL=http://ollama:11434.
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-}
      LMSTUDIO_BASE_URL: ${LMSTUDIO_BASE_URL:-}
      VLLM_BASE_URL: ${VLLM_BASE_URL:-}

      # Server bind. Leaving RLM_STUDIO_HOST at 0.0.0.0 inside the container
      # is correct — container isolation is the security boundary, not
      # loopback. Do not publish the port to a public interface without
      # a reverse proxy in front.
      RLM_STUDIO_HOST: 0.0.0.0
      RLM_STUDIO_PORT: "8000"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      # Persisted state: config, sessions, evaluations, telemetry.db,
      # api_keys.json fallback. See docs/OPERATIONS.md §2.
      - rlm-studio-data:/home/rlmstudio/.rlm-studio
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read(); sys.exit(0)"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
      args:
        # Baked into the client bundle at build time. Browser requests
        # go to this URL — which is the host's localhost, not the
        # container network — because the browser is on the host.
        NEXT_PUBLIC_API_URL: http://localhost:8000
        NEXT_PUBLIC_RLM_STUDIO_PERF_UI: ${NEXT_PUBLIC_RLM_STUDIO_PERF_UI:-}
    image: rlm-studio-frontend:local
    container_name: rlm-studio-frontend
    restart: unless-stopped
    environment:
      # Next.js server-side rewrites (see frontend/next.config.ts) run
      # inside this container and call the backend via the compose
      # network, not via the host.
      NEXT_PUBLIC_API_URL: http://backend:8000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      backend:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Optional smoke-test inference backend. Uncomment to run a local Ollama
  # alongside the stack — useful for a "does the plumbing work end-to-end"
  # test without a cloud provider key.
  #
  # With this enabled:
  #   1. Uncomment the service below.
  #   2. In your .env, set OLLAMA_BASE_URL=http://ollama:11434.
  #   3. After `docker compose up`, pull a model:
  #        docker compose exec ollama ollama pull llama3.2
  #   4. Add an Ollama provider in Settings with base URL
  #      http://localhost:11434 (from the host) or http://ollama:11434
  #      (from the backend's perspective — what the compose env uses).
  # ---------------------------------------------------------------------------
  #
  # ollama:
  #   image: ollama/ollama:latest
  #   container_name: rlm-studio-ollama
  #   restart: unless-stopped
  #   ports:
  #     - "127.0.0.1:11434:11434"
  #   volumes:
  #     - ollama-models:/root/.ollama

volumes:
  rlm-studio-data:
    name: rlm-studio-data
  # ollama-models:
  #   name: rlm-studio-ollama-models
